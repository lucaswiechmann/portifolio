<!DOCTYPE html>
<html>
<head>
    <title>Create Circular Favicon</title>
</head>
<body>
    <canvas id="canvas32" width="32" height="32" style="border: 1px solid #ccc; margin: 10px;"></canvas>
    <canvas id="canvas16" width="16" height="16" style="border: 1px solid #ccc; margin: 10px;"></canvas>
    <canvas id="canvas180" width="180" height="180" style="border: 1px solid #ccc; margin: 10px;"></canvas>
    
    <br>
    <button onclick="createFavicons()">Create Circular Favicons</button>
    <button onclick="downloadAll()">Download All</button>

    <script>
        function createFavicons() {
            const sizes = [32, 16, 180];
            
            sizes.forEach(size => {
                const canvas = document.getElementById(`canvas${size}`);
                const ctx = canvas.getContext('2d');
                
                // Clear canvas
                ctx.clearRect(0, 0, size, size);
                
                // Create circular clipping path
                ctx.beginPath();
                ctx.arc(size/2, size/2, size/2, 0, 2 * Math.PI);
                ctx.clip();
                
                // Load and draw the image
                const img = new Image();
                img.onload = function() {
                    ctx.drawImage(img, 0, 0, size, size);
                };
                img.src = 'images/icon-profile.png';
            });
        }
        
        function downloadCanvas(canvas, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL();
            link.click();
        }
        
        function downloadAll() {
            downloadCanvas(document.getElementById('canvas32'), 'favicon-32x32.png');
            downloadCanvas(document.getElementById('canvas16'), 'favicon-16x16.png');
            downloadCanvas(document.getElementById('canvas180'), 'apple-touch-icon.png');
        }
        
        // Auto-create when page loads
        window.onload = createFavicons;
    </script>
</body>
</html>
